<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TRPoP Sigma 构筑图谱</title>
<style>
:root{--bg:#0f0c0a;--panel:#17110e;--text:#f3dcc1;--muted:#a89278;--line:#f2c46b26;--gold:#ffd36a;--select:#ffd36a;--recommend:#78f0ff;--weapon:#f2c46b;--tool:#55d7c2;--affix:#a38df7;--med:#ff9866;--state:#d8d1c5;--arch:#ffd36a;--poison:#cbd000;--freeze:#91d8e3;--fire:#ff8840;--resin:#a38df7;--stun:#fedf49;--crit:#ff6b78;--energy:#80ffd0}html[data-theme="light"]{--bg:#fbf3e2;--panel:#fff8eb;--text:#211714;--muted:#78675b;--line:#2b1c1422;--gold:#9a6100;--select:#9a6100;--recommend:#247c89;--weapon:#9a6100;--tool:#207b70;--affix:#6b4bbd;--med:#b85c24;--state:#5e5148;--arch:#9a6100;--poison:#71810f;--freeze:#277985;--fire:#bb4f19;--resin:#6b4bbd;--stun:#9a7a00;--crit:#b83a48;--energy:#1c8a46}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#4f321026,transparent 38%),var(--bg);color:var(--text);font:14px/1.45 "Microsoft YaHei",Consolas,"Courier New",monospace;overflow:hidden}.top{position:fixed;left:22px;right:22px;top:18px;z-index:10;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;pointer-events:none}.mark{white-space:pre;color:var(--gold);opacity:.35;font-size:11px;line-height:1}.title{display:flex;gap:12px;align-items:baseline}.title h1{margin:0;color:var(--text);font-size:16px;font-weight:600;letter-spacing:.08em}.title span{color:var(--muted);font-size:12px}.controls{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;pointer-events:auto}.controls button{border:0;background:transparent;color:var(--muted);padding:0;cursor:pointer;font:inherit}.controls button.active,.controls button:hover{color:var(--gold);text-decoration:underline;text-underline-offset:3px}.bar{position:fixed;left:22px;right:22px;top:84px;z-index:10;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}.bar input{height:36px;border:0;border-bottom:1px solid var(--line);background:#0000;color:var(--text);outline:0;font:inherit}.bar button{border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 70%,transparent);color:var(--muted);height:34px;padding:0 12px;cursor:pointer;font:inherit}.bar button:hover{color:var(--gold);border-color:#ffd36a66}.legend{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:4px}.viewport{position:fixed;left:22px;right:22px;top:132px;bottom:58px;border:1px solid var(--line);background:linear-gradient(180deg,#ffffff05,#0000)}#sigma{position:absolute;inset:0}.status{position:fixed;left:22px;right:22px;bottom:18px;z-index:10;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;color:var(--muted);font-size:12px}.panel{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);padding:3px 7px;color:var(--muted);background:color-mix(in srgb,var(--panel) 58%,transparent)}.chip strong{color:var(--text);font-weight:500}.hint{color:var(--muted);text-align:right}.tip{position:fixed;z-index:30;max-width:340px;padding:10px 12px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 96%,black);color:var(--muted);pointer-events:none;display:none;box-shadow:0 12px 38px #0008}.tip.show{display:block}.tip-title{color:var(--text);margin-bottom:4px}.tip-meta{font-size:11px;color:var(--gold);margin-bottom:6px}.tip-desc{font-size:12px}.text-poison{color:var(--poison)}.text-freeze{color:var(--freeze)}.text-fire{color:var(--fire)}.text-resin{color:var(--resin)}.text-stun{color:var(--stun)}.text-critical{color:var(--crit)}.text-energy{color:var(--energy)}.error{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:720px;border:1px solid #ff8b55;padding:18px 20px;background:var(--panel);color:var(--text);z-index:40}@media(max-width:900px){.top,.bar,.status{left:14px;right:14px}.top{grid-template-columns:1fr}.bar{grid-template-columns:1fr;top:98px}.viewport{left:14px;right:14px;top:194px}.hint{text-align:left}}
</style>
</head>
<body>
<header class="top"><pre class="mark">+-- TRPoP SIGMA GRAPH --+</pre><div class="title"><h1>构筑图谱</h1><span>Sigma.js / Graphology / force-free clustered layout</span></div><div class="controls"><span>[theme:</span><button id="themeDark" class="active">dark</button><span>|</span><button id="themeLight">light</button><span>]</span><span>[lang:</span><button id="langZh" class="active">zh</button><span>|</span><button id="langEn">en</button><span>]</span></div></header>
<section class="bar"><input id="search" type="search" placeholder="搜索节点：毒 / 暴击 / energy / resin / freeze" /><div class="legend"><span><i style="background:var(--weapon)"></i>武器</span><span><i style="background:var(--tool)"></i>工具</span><span><i style="background:var(--affix)"></i>词条</span><span><i style="background:var(--med)"></i>徽章</span></div><button id="clear">clear</button></section>
<main class="viewport"><div id="sigma"></div></main>
<footer class="status"><div id="status" class="panel"></div><div class="hint">滚轮缩放 · 拖动画布 · 点击节点选择已获得 · 搜索自动定位</div></footer>
<div id="tip" class="tip"></div>
<script>window.global=window.global||window;window.process=window.process||{env:{}};window.process.env=window.process.env||{};window.process.env.NODE_ENV=window.process.env.NODE_ENV||'production';</script>
<script src="assets/vendor/graphology.umd.min.js"></script>
<script src="assets/vendor/sigma.min.js"></script>
<script src="assets/graph_data.js"></script>
<script>
const src=window.TRPOP_GRAPH_DATA;
const GraphCtor=window.graphology?.Graph||window.Graph;
const SigmaCtor=window.Sigma;
const selected=new Set();let lang='zh',renderer,graph,hovered=null,lastSearch='';
const colors={weapon:'#f2c46b',tool:'#55d7c2',affix:'#a38df7',medallion:'#ff9866',state:'#d8d1c5',archetype:'#ffd36a',poison:'#cbd000',freeze:'#91d8e3',fire:'#ff8840',resin:'#a38df7',stun:'#fedf49',crit:'#ff6b78',energy:'#80ffd0',heal:'#7ee6a5',gold:'#ffd36a',damage:'#e8d7bf',corrupted:'#bc7cff'};
const kindName={zh:{weapon:'武器',tool:'工具',affix:'词条',medallion:'徽章',state:'状态',archetype:'流派'},en:{weapon:'weapon',tool:'tool',affix:'affix',medallion:'medallion',state:'state',archetype:'archetype'}};
const stateDefs=[['poison','中毒','Poison'],['freeze','冻结','Freeze'],['fire','燃烧','Burn'],['resin','树脂','Resin'],['stun','眩晕','Stun'],['crit','暴击','Critical'],['energy','能量循环','Energy Loop'],['special','特殊攻击','Special'],['shield','保护光环','Shield Aura'],['vayu','风神之息',"Vayu's Breath"],['heal','治疗/生存','Healing'],['gold','金币经济','Gold'],['damage','通用伤害','Damage'],['corrupted','腐化','Corrupted']];
const archetypes=[['poison_dot','毒 DOT','Poison DOT',['poison']],['freeze_control','冰冻控制','Freeze Control',['freeze']],['fire_burst','火焰爆发','Fire Burst',['fire']],['resin_control','树脂控制','Resin Control',['resin']],['crit_chain','暴击连锁','Crit Chain',['crit']],['tool_loop','工具循环','Tool Loop',['tool','energy']],['special_attack','特殊攻击流','Special Attack',['special']],['survival_convert','生存转伤','Survival Convert',['shield','heal']]];
const tagState={poison:'poison',freeze:'freeze',fire:'fire',resin:'resin',stun:'stun',crit:'crit',energy:'energy',vayu:'vayu',heal:'heal',gold:'gold',damage:'damage',danger:'corrupted',special:'special',tool:'energy'};
const tagArch={poison:'poison_dot',freeze:'freeze_control',fire:'fire_burst',resin:'resin_control',crit:'crit_chain',energy:'tool_loop',tool:'tool_loop',special:'special_attack',heal:'survival_convert',shield:'survival_convert',stun:'crit_chain'};
const centers={poison:[-12,-7],freeze:[0,-9],fire:[12,-7],resin:[-13,2],stun:[13,2],crit:[-8,11],energy:[4,12],special:[12,10],vayu:[-2,6],heal:[-14,11],gold:[0,16],damage:[16,-1],corrupted:[-4,-15],generic:[0,0]};
function escapeHtml(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function stripHtml(s){return String(s??'').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'')}
function colorText(s){return escapeHtml(stripHtml(s)).replace(/中毒|毒素|毒|poison/gi,m=>`<span class="text-poison">${m}</span>`).replace(/冻结|冰冻|freeze|frozen/gi,m=>`<span class="text-freeze">${m}</span>`).replace(/燃烧|火焰|点燃|fire|burn/gi,m=>`<span class="text-fire">${m}</span>`).replace(/树脂|resin/gi,m=>`<span class="text-resin">${m}</span>`).replace(/眩晕|击晕|stun/gi,m=>`<span class="text-stun">${m}</span>`).replace(/暴击|crit/gi,m=>`<span class="text-critical">${m}</span>`).replace(/能量|energy/gi,m=>`<span class="text-energy">${m}</span>`)}
function primary(tags=[]){return ['poison','freeze','fire','resin','stun','crit','energy','special','vayu','heal','gold','damage','corrupted'].find(t=>tags.includes(t))||tags[0]||'generic'}
function label(a){return a.label?.[lang]||a.label?.zh||a.label||a.id}
function klabel(k){return kindName[lang][k]||k}
function nodeColor(kind,tags){const p=primary(tags);return colors[p]||colors[kind]||colors.state}
function addNode(kind,id,label,tags,extra={}){const p=primary(tags);const c=centers[p]||centers.generic;const count=graph.order;const angle=(count*137.5%360)*Math.PI/180;const r=kind==='archetype'?2.2:kind==='state'?4.1:6.6+(count%7)*.34;graph.addNode(`${kind}:${id}`,{kind,ref:id,label,tags:[...new Set(tags||[])],primary:p,x:c[0]+Math.cos(angle)*r,y:c[1]+Math.sin(angle)*r,size:sizeFor(kind),color:nodeColor(kind,tags),baseColor:nodeColor(kind,tags),baseSize:sizeFor(kind),...extra})}
function sizeFor(k){return {weapon:8,tool:7,affix:6,medallion:6,state:5,archetype:12}[k]||5}
function edge(a,b,type='supports',weight=1){if(a&&b&&a!==b&&graph.hasNode(a)&&graph.hasNode(b)&&!graph.hasEdge(a,b))graph.addEdge(a,b,{type,weight,color:'rgba(180,160,120,.22)',size:1})}
function linkAbility(from,a,type,w){const s=String(a).toLowerCase();const pairs=[['poison','poison'],['freeze','freeze'],['frozen','freeze'],['fire','fire'],['burn','fire'],['resin','resin'],['stun','stun'],['crit','crit'],['energy','energy'],['vayu','vayu'],['special','special'],['shield','shield'],['heal','heal'],['gold','gold'],['damage','damage'],['tool','energy'],['corrupt','corrupted']];const hit=pairs.find(([k])=>s.includes(k));if(hit)edge(from,`state:${hit[1]}`,type,w)}
function build(){graph=new GraphCtor();src.weapons.forEach(w=>addNode('weapon',w.id,{zh:w.zh,en:w.en},w.tags,{desc:{zh:w.special?.[1]||w.zh,en:w.special?.[0]||w.en},provides:w.provides||[],requires:w.requires||[],scales:w.scales||[]}));src.tools.forEach(t=>addNode('tool',t.id,{zh:t.zh,en:t.en},t.tags,{desc:{zh:t.zh,en:t.desc},provides:t.provides||[],requires:t.requires||[],scales:t.scales||[]}));src.affixes.forEach(a=>addNode('affix',a.id,{zh:a.name,en:a.id.replace(/_/g,' ')},a.tags,{desc:{zh:a.zh,en:a.en},trigger:a.trigger,effect:a.effect}));src.data.forEach(m=>addNode('medallion',m.id,{zh:m.zh,en:m.en},m.tags,{desc:{zh:src.values[m.id]?.[0]||m.desc,en:src.values[m.id]?.[1]||m.edesc}}));stateDefs.forEach(([id,zh,en])=>addNode('state',id,{zh,en},[id]));archetypes.forEach(([id,zh,en,t])=>addNode('archetype',id,{zh,en},t));graph.forEachNode((id,a)=>{if(['weapon','tool','medallion','affix'].includes(a.kind)){a.tags.forEach(t=>{if(tagState[t])edge(id,`state:${tagState[t]}`,a.kind==='affix'&&id.includes('damage_vs_')?'requires':'supports',3);if(tagArch[t])edge(id,`archetype:${tagArch[t]}`,'supports',2)});(a.provides||[]).forEach(p=>linkAbility(id,p,'provides',5));(a.requires||[]).forEach(r=>linkAbility(id,r,'requires',4));(a.scales||[]).forEach(s=>linkAbility(id,s,'scales',3));if(a.kind==='affix'){if(a.trigger&&a.trigger!=='always')linkAbility(id,a.trigger,'requires',4);if(a.effect)linkAbility(id,a.effect,'scales',3)}}});stateDefs.forEach(([id])=>{if(tagArch[id])edge(`state:${id}`,`archetype:${tagArch[id]}`,'supports',5)});manualEdges()}
function manualEdges(){[['weapon:poisoned_claws','state:poison'],['weapon:poisoned_claws','state:crit'],['weapon:shamal_crescent','state:freeze'],['weapon:blazing_cuffs','state:fire'],['weapon:blazing_cuffs','state:shield'],['weapon:hammer_knife','state:energy'],['tool:freezing_arrow_launcher','state:freeze'],['tool:ice_trap','state:freeze'],['tool:fire_vial','state:fire'],['tool:flaming_horses','state:fire'],['tool:grappling_hook','state:stun']].forEach(([a,b])=>edge(a,b,'provides',5));['poison','freeze','fire','resin','stun'].forEach(s=>edge(`state:${s}`,'archetype:crit_chain','supports',2))}
function neighborsOf(ids){const s=new Set(ids);ids.forEach(id=>{if(!graph.hasNode(id))return;graph.forEachNeighbor(id,n=>s.add(n))});return s}
function scoreNodes(active){const scores=new Map();if(!selected.size)return scores;graph.forEachEdge((e,a,src,tgt)=>{if(selected.has(src)&&!selected.has(tgt))scores.set(tgt,(scores.get(tgt)||0)+(a.weight||1)*(a.type==='requires'?-1:1));if(active.has(src)&&!selected.has(tgt))scores.set(tgt,(scores.get(tgt)||0)+(a.weight||1)*.32)});selected.forEach(id=>scores.delete(id));return scores}
function update(){const q=document.querySelector('#search').value.trim().toLowerCase();const active=selected.size?neighborsOf([...selected]):new Set();const scores=scoreNodes(active);const max=Math.max(1,...scores.values());let visible=0;graph.forEachNode((id,a)=>{const hay=[id,label(a),a.kind,...(a.tags||[]),a.desc?.zh||'',a.desc?.en||''].join(' ').toLowerCase();const match=!q||hay.includes(q);const selectedNode=selected.has(id);const activeNode=selectedNode||active.has(id);const score=scores.get(id)||0;const rec=score>=Math.max(2,max*.45);let color=a.baseColor,size=a.baseSize;if(selectedNode){color=colors.select||'#ffd36a';size=a.baseSize*1.65}else if(rec){color=colors.recommend;size=a.baseSize*1.45}else if(activeNode){size=a.baseSize*1.2}else if((selected.size&&!activeNode)||(!match&&q)){color='rgba(130,120,105,.22)';size=Math.max(2,a.baseSize*.72)}if(match||activeNode||rec)visible++;graph.setNodeAttribute(id,'color',color);graph.setNodeAttribute(id,'size',size);graph.setNodeAttribute(id,'highlighted',selectedNode||rec||activeNode);});graph.forEachEdge((e,a,src,tgt)=>{const hot=selected.has(src)||selected.has(tgt);const rec=(selected.has(src)||active.has(src))&&(scores.get(tgt)||0)>=2;graph.setEdgeAttribute(e,'color',hot?'rgba(255,211,106,.9)':rec?'rgba(120,240,255,.72)':selected.size?'rgba(120,110,95,.06)':'rgba(180,160,120,.18)');graph.setEdgeAttribute(e,'size',hot||rec?2.4:1)});renderStatus(visible,scores)}
function renderStatus(visible,scores){const arche=[...scores.entries()].filter(([id])=>id.startsWith('archetype:')).sort((a,b)=>b[1]-a[1]).slice(0,3);const rec=[...scores.entries()].filter(([id,v])=>v>=2&&!id.startsWith('archetype:')&&!id.startsWith('state:')).sort((a,b)=>b[1]-a[1]).slice(0,4);status.innerHTML=`<span class="chip">visible <strong>${visible}/${graph.order}</strong></span><span class="chip">edges <strong>${graph.size}</strong></span><span class="chip">selected <strong>${selected.size}/9</strong></span>${arche.map(([id,v])=>`<span class="chip">${escapeHtml(label(graph.getNodeAttributes(id)))} <strong>${Math.round(v*10)}%</strong></span>`).join('')}${rec.length?`<span class="chip">recommend <strong>${rec.map(([id])=>escapeHtml(label(graph.getNodeAttributes(id)))).join(' / ')}</strong></span>`:''}`}
function showTip(id,e){const a=graph.getNodeAttributes(id);tip.innerHTML=`<div class="tip-title">${escapeHtml(label(a))}</div><div class="tip-meta">${klabel(a.kind)} · ${(a.tags||[]).join(' / ')}</div><div class="tip-desc">${colorText(a.desc?.[lang]||a.desc?.zh||a.desc?.en||'')}</div>`;tip.classList.add('show');moveTip(e.event||e)}
function moveTip(e){const pad=14;let x=e.clientX+14,y=e.clientY+16;const r=tip.getBoundingClientRect();if(x+r.width>innerWidth-pad)x=e.clientX-r.width-14;if(y+r.height>innerHeight-pad)y=e.clientY-r.height-14;tip.style.left=Math.max(pad,x)+'px';tip.style.top=Math.max(pad,y)+'px'}function hideTip(){tip.classList.remove('show')}
function locate(id){const a=graph.getNodeAttributes(id);renderer.getCamera().animate({x:a.x,y:a.y,ratio:.08},{duration:350})}
function bind(){renderer.on('clickNode',({node})=>{selected.has(node)?selected.delete(node):selected.add(node);update()});renderer.on('enterNode',e=>showTip(e.node,e));renderer.on('leaveNode',hideTip);renderer.getMouseCaptor().on('mousemovebody',moveTip);search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();update();if(!q||q===window.lastQ)return;window.lastQ=q;const found=graph.findNode((id,a)=>[id,label(a),a.kind,...(a.tags||[])].join(' ').toLowerCase().includes(q));if(found)locate(found)});clear.onclick=()=>{selected.clear();search.value='';update()};themeDark.onclick=()=>setTheme('dark');themeLight.onclick=()=>setTheme('light');langZh.onclick=()=>{lang='zh';langZh.classList.add('active');langEn.classList.remove('active');refreshLabels()};langEn.onclick=()=>{lang='en';langEn.classList.add('active');langZh.classList.remove('active');refreshLabels()}}
function refreshLabels(){graph.forEachNode((id,a)=>graph.setNodeAttribute(id,'label',label(a)));update()}
function setTheme(t){document.documentElement.dataset.theme=t;themeDark.classList.toggle('active',t==='dark');themeLight.classList.toggle('active',t==='light');try{localStorage.setItem('trpop-sigma-theme',t)}catch(e){}}
function init(){if(!GraphCtor||!SigmaCtor)throw new Error('Sigma/Graphology vendor files failed to load.');build();graph.forEachNode((id,a)=>graph.setNodeAttribute(id,'label',label(a)));renderer=new SigmaCtor(graph,document.getElementById('sigma'),{renderEdgeLabels:false,allowInvalidContainer:true,labelRenderedSizeThreshold:7,defaultEdgeType:'line'});bind();setTheme(localStorage.getItem('trpop-sigma-theme')||'dark');update();renderer.getCamera().setState({x:0,y:0,ratio:.22})}
try{init()}catch(e){document.body.insertAdjacentHTML('beforeend',`<div class="error"><b>Sigma 图谱初始化失败</b><br>${escapeHtml(e.message||e)}</div>`);console.error(e)}
</script>
</body>
</html>
