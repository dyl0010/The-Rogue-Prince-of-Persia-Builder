function capsFor(n){const caps={provides:new Set(),requires:new Set(),scales:new Set(),supports:new Set(),synergy:new Set()};const id=n.id,ref=n.ref,t=new Set(n.tags||[]);const add=(k,v)=>{if(k!=='supports')caps[k].add(v)};if(t.has('poison')){add('supports','poison_dot');if(id.includes('damage_vs_poison')||id.includes('PoisonedEnemy'))add('requires','poison_apply');else add('provides','poison_apply')}if(t.has('freeze')){add('supports','freeze_control');if(id.includes('damage_vs_freeze')||id.includes('FreezedEnemy')||id.includes('BoostDamageFreezeBreak'))add('requires','freeze_apply');else add('provides','freeze_apply')}if(t.has('fire')){add('supports','fire_burst');if(id.includes('damage_vs_fire')||id.includes('BurntEnemy'))add('requires','fire_apply');else add('provides','fire_apply')}if(t.has('resin')){add('supports','resin_control');if(id.includes('damage_vs_resin')||id.includes('StagnatedEnemy'))add('requires','resin_apply');else add('provides','resin_apply')}if(t.has('stun')){if(id.includes('damage_vs_stun')||id.includes('StunnedEnemy'))add('requires','stun_apply');else add('provides','stun_apply')}if(t.has('crit')){add('supports','crit_chain');if(id.includes('crit_damage')||id.includes('CritDamage'))add('scales','crit_scaling');else add('provides','crit_trigger')}if(t.has('energy')){add('supports','tool_loop');add('provides','energy_gain')}if(t.has('vayu'))add('provides','vayu_gain');if(t.has('heal')||t.has('shield'))add('supports','survival_convert');if(id==='weapon:poisoned_claws'){add('provides','poison_apply');add('provides','crit_on_poison');add('supports','poison_dot');add('supports','crit_chain')}if(id==='weapon:shamal_crescent')add('provides','freeze_apply');if(id==='weapon:blazing_cuffs'){add('provides','fire_apply');add('provides','shield_source');add('supports','survival_convert')}if(id==='weapon:hammer_knife'){add('provides','energy_gain');add('supports','tool_loop')}if(id==='tool:freezing_arrow_launcher'||id==='tool:ice_trap')add('provides','freez function buildSemanticIndex(){nodeMeta=new Map();capProviders=new Map();capConsumers=new Map();routeMembers=new Map();baseNodes.forEach(n=>{const c=capsFor(n);nodeMeta.set(n.id,c);c.provides.forEach(cap=>addSet(capProviders,cap,n.id));c.requires.forEach(cap=>addSet(capConsumers,cap,n.id))});baseNodes.forEach(n=>{const c=nodeMeta.get(n.id);c.provides.forEach(cap=>(capConsumers.get(cap)||[]).forEach(to=>{if(to!==n.id){edge(n.id,to,'synergy',6);c.synergy.add(to)}}));c.requires.forEach(cap=>(capProviders.get(cap)||[]).forEach(to=>{if(to!==n.id){edge(n.id,to,'synergy',5);c.synergy.add(to)}}));c.synergy.forEach(to=>{if(nodeMap.has(to))edge(n.id,to,'synergy',7)})})}
function build(){src.weapons.forEach(w=>{const zh=src.weaponZhDetails?.[w.id];addNode('weapon',w.id,{zh:zh?.name||w.zh,en:w.en},w.tags,{desc:{zh:zh?.desc||w.special?.[1]||w.zh,en:w.special?.[0]||w.en},note:{zh:zh?.note||'',en:''},provides:w.provides||[],requires:w.requires||[],scales:w.scales||[]})});src.tools.forEach(t=>{const zh=src.toolZhDetails?.[t.id];addNode('tool',t.id,{zh:zh?.name||t.zh,en:t.en},t.tags,{desc:{zh:zh?.desc||t.zh,en:t.desc},note:{zh:zh?.note||'',en:''},provides:t.provides||[],requires:t.requires||[],scales:t.scales||[]})});src.affixes.forEach(a=>addNode('affix',a.id,{zh:a.name,en:a.id.replace(/_/g,' ')},a.tags,{desc:{zh:a.zh,en:a.en},note:{zh:`trigger: ${a.trigger} · effect: ${a.effect}`,en:`trigger: ${a.trigger} · effect: ${a.effect}`},trigger:a.trigger,effect:a.effect}));src.data.forEach(m=>addNode('medallion',m.id,{zh:m.zh,en:m.en},m.tags,{desc:{zh:src.values[m.id]?.[0]||m.desc,en:src.values[m.id]?.[1]||m.edesc},note:{zh:m.id,en:m.id}}));stateDefs.forEach(([id,zh,en])=>addNode('state',id,{zh,en},[id],{desc:{zh:'机制 / 状态节点，用于连接真实装备与触发条件。',en:'Mechanic/state node connecting real equipment and trigger conditions.'}}));baseNodes.forEach(n=>{if(['weapon','tool','medallion','affix'].includes(n.kind)){n.tags.forEach(t=>{if(tagState[t])edge(n.id,`state:${tagState[t]}`,n.kind==='affix'&&n.id.includes('damage_vs_')?'requires':'supports',n.kind==='affix'?4:3)});(n.provides||[]).forEach(p=>linkAbility(n.id,p,'provides',5));(n.requires||[]).forEach(r=>linkAbility(n.id,r,'requires',4));(n.scales||[]).forEach(s=>linkAbility(n.id,s,'scales',3));if(n.kind==='affix'){if(n.trigger&&n.trigger!=='always')linkAbility(n.id,n.trigger,'requires',4);if(n.effect)linkAbility(n.id,n.effect,'scales',3)}}});manualEdges();buildSemanticIndex()}
function manualEdges(){[['medallion:B-Always-BuffAtkElementary-Left','state:fire'],['medallion:B-Always-BuffAtkElementary-Left','state:freeze'],['medallion:B-Always-BuffAtkElementary-Left','state:poison'],['medallion:B-Always-BuffAtkElementary-Left','state:resin'],['medallion:B-Always-BuffAtkElementary-Right','state:fire'],['medallion:B-Always-BuffAtkElementary-Right','state:freeze'],['medallion:B-Always-BuffAtkElementary-Right','state:poison'],['medallion:B-Always-BuffAtkElementary-Right','state:resin'],['medallion:R-SystemicDmg-GainGold','state:fire'],['medallion:R-SystemicDmg-GainGold','state:freeze'],['medallion:R-SystemicDmg-GainGold','state:poison'],['medallion:R-SystemicDmg-GainGold','state:resin'],['weapon:poisoned_claws','state:poison'],['weapon:poisoned_claws','state:crit'],['weapon:censer','state:fire'],['weapon:censer','state:crit'],['weapon:monk_staff','state:stun'],['weapon:monk_staff','state:crit'],['weapon:iron_mace','state:stun'],['weapon:caestus','state:stun'],['weapon:caestus','state:crit'],['weapon:double_daggers','state:crit'],['weapon:panjeh_poladin','state:crit'],['weapon:corrupted_sword','state:corrupted'],['weapon:corrupted_sword','state:crit'],['weapon:berserkers_axes','state:energy'],['weapon:dented_pot','state:crit'],['weapon:kaalis_scythes','state:crit'],['weapon:shamal_crescent','state:freeze'],['weapon:blazing_cuffs','state:fire'],['weapon:blazing_cuffs','state:shield'],['weapon:corrupted_spear','state:corrupted'],['weapon:corrupted_spear','state:crit'],['weapon:royal_sword','state:crit'],['weapon:broadsword','state:shield'],['weapon:broadsword','state:crit'],['weapon:imperial_axe','state:shield'],['weapon:imperial_axe','state:crit'],['weapon:corrupted_axe','state:energy'],['weapon:javelin','state:crit'],['weapon:slayer','state:crit'],['weapon:hammer_knife','state:energy'],['tool:freezing_arrow_launcher','state:freeze'],['tool:ice_trap','state:freeze'],['tool:fire_vial','state:fire'],['tool:flaming_horses','state:fire'],['tool:grapplin function relationWeight(t){return {synergy:6,provides:4,requires:4,route:3,scales:2,supports:1}[t]||1}
function semanticNeighbors(id){const out=[];baseEdges.forEach(e=>{if(e.from===id&&e.type!=='supports')out.push([e.to,e]);if(e.to===id&&(e.type==='synergy'||e.type==='provides'||e.type==='requires'||e.type==='route'))out.push([e.from,e])});return out}
function relatedByDepth(ids,maxDepth){const seen=new Map(),queue=ids.map(id=>[id,0]);while(queue.length){const [id,d]=queue.shift();if(seen.has(id)&&seen.get(id)<=d)continue;seen.set(id,d);if(d>=maxDepth)continue;semanticNeighbors(id).forEach(([next])=>queue.push([next,d+1]))}return seen}
function scoreNodes(depths){const scores=new Map();if(!selected.size)return scores;baseEdges.forEach(e=>{const d=depths.get(e.from);if(d!==undefined&&!selected.has(e.to)){const falloff=1/(d+1);scores.set(e.to,(scores.get(e.to)||0)+relationWeight(e.type)*(e.weight||1)*falloff)}});selected.forEach(id=>scores.delete(id));return scores}
function update(){const q=dom.search.value.trim().toLowerCase(),maxDepth=Number(dom.depthRange.value)||1;dom.depthValue.textContent=maxDepth;dom.depthAscii.forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.depth)<=maxDepth));const depths=selected.size?relatedByDepth([...selected],maxDepth):new Map();const scores=scoreNodes(depths),max=Math.max(1,...scores.values());let visible=0;const ns=[],es=[];baseNodes.forEach(n=>{const hay=[n.id,label(n),n.kind,...n.tags,n.desc?.zh||'',n.desc?.en||''].join(' ').toLowerCase();const match=!q||hay.includes(q);const sel=selected.has(n.id),d=depths.get(n.id),act=d!==undefined,score=scores.get(n.id)||0,rec=score>=Math.max(2,max*.45);let color=n.baseColor,sz=n.baseSize,bw=1,font='#f3dcc1';if(sel){color=colors.select;sz=n.baseSize*1.75;bw=3}else if(rec){color=colors.recommend;sz=n.baseSize*(1.42-Math.min(d||1,4)*.04);bw=2}else if(act){const fade=Math.max(.45,1-(d||0)*.14);sz=n.baseSize*(1.18-Math.min(d||0,4)*.04);bw=d===1?2:1;color=n.baseColor;font=`rgba(243,220,193,${fade})`}else if((selected.size&&!act)||(!match&&q)){color='rgba(130,120,105,.22)';font='rgba(170,160,145,.32)';sz=Math.max(8,n.baseSize*.66)}if(match||act||rec)visible++;ns.push({...n,label:label(n),physics:false,size:sz,color:{background:color,border:color,highlight:{background:colors.select,border:colors.select}},borderWidth:bw,font:{...n.font,color:font}})});baseEdges.forEach(e=>{const df=depths.get(e.from),dt=depths.get(e.to),hot=selected.has(e.from)||selected.has(e.to),inPath=df!==undefined&&dt!==undefined&&Math.abs(df-dt)<=1,rec=(df!==undefined)&&(scores.get(e.to)||0)>=2;let edgeColor='rgba(180,160,120,.18)',width=1;if(hot){edgeColor='rgba(255,211,106,.92)';width=3}else if(rec||e.type==='synergy'&&inPath){edgeColor='rgba(120,240,255,.74)';width=2.4}else if(selected.size&&!inPath){edgeColor='rgba(120,110,95,.045)'}es.push({...e,width,color:{color:edgeColor,highlight:colors.select}})});nodesDS.update(ns);edgesDS.update(es);renderStatus(visible,scores,maxDepth)}
function renderStatus(visible,scores,depth){const rec=[...scores.entries()].filter(([id,v])=>v>=2&&!id.startsWith('state:')).sort((a,b)=>b[1]-a[1]).slice(0,5);const parts=[`depth:${depth}`,`visible:${visible}/${baseNodes.length}`,`edges:${baseEdges.length}`,`selected:${selected.size}/9`];if(rec.length)parts.push(`recommend:${rec.map(([id])=>escapeHtml(label(nodeMap.get(id)))).join('/')}`);dom.status.innerHTML=parts.map(p=>`<span class="chip">[${p}]</span>`).join(' ')}
function tipDesc(n){const text=n.desc?.[lang]||n.desc?.zh||n.desc?.en||'';return lang==='zh'?formatGameText(text):colorText(text)}function tipNote(n){const text=n.note?.[lang]||n.note?.zh||n.note?.en||'';return text?`<div class="tip-note">${lang==='zh'?formatGameText(text):colorText(text)}</div>`:''}function showTip(id,ev){const n=nodeMap.get(id);if(!n)return;dom.tip.innerHTML=`<div class="tip-title">${escapeHtml(label(n))}</div><div class="tip-meta">${klabel(n.kind)} · ${n.tags.join(' / ')}</div><div class="tip-desc">${tipDesc(n)}</div>${tipNote(n)}`;dom.tip.classList.add('show');moveTip(ev?.event?.srcEvent||ev?.event||ev)}function moveTip(e){const pad=14,point=e&&Number.isFinite(e.clientX)&&Number.isFinite(e.clientY)?e:{clientX:innerWidth/2,clientY:innerHeight/2};let x=point.clientX+14,y=point.clientY+16;const r=dom.tip.getBoundingClientRect();if(x+r.width>innerWidth-pad)x=point.clientX-r.width-14;if(y+r.height>innerHeight-pad)y=point.clientY-r.height-14;dom.tip.style.left=Math.max(pad,x)+'px';dom.tip.style.top=Math.max(pad,y)+'px'}function hideTip(){dom.tip.classList.remove('show')}
