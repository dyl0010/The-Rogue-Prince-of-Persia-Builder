function moveTip(e){const pad=14;let x=e.clientX+14,y=e.clientY+16;const r=el.tip.getBoundingClientRect();if(x+r.width>innerWidth-pad)x=e.clientX-r.width-14;if(y+r.height>innerHeight-pad)y=e.clientY-r.height-14;el.tip.style.left=Math.max(pad,x)+'px';el.tip.style.top=Math.max(pad,y)+'px'}
function hideTip(){el.tip.classList.remove('show')}
el.viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};el.viewport.setPointerCapture(e.pointerId);el.viewport.classList.add('dragging')});el.viewport.addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;applyTransform()});el.viewport.addEventListener('pointerup',()=>{drag=null;el.viewport.classList.remove('dragging')});el.viewport.addEventListener('pointercancel',()=>{drag=null;el.viewport.classList.remove('dragging')});el.viewport.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,view.z*(e.deltaY>0?.9:1.1))},{passive:false});
document.querySelector('#zoomIn').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,view.z*1.18);document.querySelector('#zoomOut').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,view.z/1.18);document.querySelector('#zoomReset').onclick=()=>{view={x:80,y:60,z:.52};applyTransform();update()};document.querySelector('#clear').onclick=()=>{selected.clear();el.search.value='';update()};
el.search.addEventListener('input',()=>{update();const q=el.search.value.trim().toLowerCase();if(!q||q===lastSearch)return;lastSearch=q;const n=nodes.find(n=>[n.id,labelOf(n),n.kind,...n.tags].join(' ').toLowerCase().includes(q));if(n)centerOn(n,Math.max(view.z,.72))});
function setTheme(t){document.documentElement.dataset.theme=t;themeDark.classList.toggle('active',t==='dark');themeLight.classList.toggle('active',t==='light');try{localStorage.setItem('trpop-graph-theme',t)}catch(e){}}themeDark.onclick=()=>setTheme('dark');themeLight.onclick=()=>setTheme('light');langZh.onclick=()=>{lang='zh';langZh.classList.add('active');langEn.classList.remove('active');render()};langEn.onclick=()=>{lang='en';langEn.classList.add('active');langZh.classList.remove('active');render()};
function fail(e){document.body.insertAdjacentHTML('beforeend',`<div class="error"><b>图谱初始化失败</b><br>${escapeHtml(e.message||e)}</div>`)}
try{setTheme(localStorage.getItem('trpop-graph-theme')||'dark');dataPack=EMBEDDED_DATA;buildGraph(dataPack);render();const first=nodeMap.get('archetype:poison_dot')||nodes[0];if(first)centerOn(first,.52)}catch(e){console.error(e);fail(e)}
</script>
</body>
</html>
